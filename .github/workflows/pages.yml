name: "Sphinx: Render docs"

on:
  push:
    branches:
      - "gh-pages"
  workflow_run:
    workflows: ["Changelog updated"]
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Run on direct pushes to gh-pages, or when the "Changelog updated" workflow
    # on master completes successfully (i.e. changelog.md was updated)
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v3

      - name: Fetch changelog from master
        run: |
          echo "<!--" > source/lastupdate.md
          echo "⚠️ DO NOT EDIT THIS FILE MANUALLY ⚠️" >> source/lastupdate.md
          echo "" >> source/lastupdate.md
          echo "This file is automatically generated and overwritten on every build" >> source/lastupdate.md
          echo "from the changelog.md file on the master branch of this repository." >> source/lastupdate.md
          echo "" >> source/lastupdate.md
          echo "To update the changelog, edit changelog.md on master:" >> source/lastupdate.md
          echo "https://github.com/giovannellilab/Geomosaic/blob/master/changelog.md" >> source/lastupdate.md
          echo "-->" >> source/lastupdate.md
          echo "" >> source/lastupdate.md
          curl -s https://raw.githubusercontent.com/giovannellilab/Geomosaic/master/changelog.md >> source/lastupdate.md

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.8'

      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3

      - run: sphinx-build -M html source build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4